# PlaceLibre · contrôles automatiques avant fusion et avant publication sur Netlify
# Lance outils/tout-tester.sh : site publié, registre des places, tests Node et Python, simulateur.
# Les tests simulent les téléphones sans réseau : aucun message n'est envoyé sur le canal réel.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tous les contrôles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contrôles
        run: bash outils/tout-tester.sh
