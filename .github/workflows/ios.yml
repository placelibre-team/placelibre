name: Application iPhone

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Compilation iPhone (simulateur)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sélectionner Xcode 26
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
      - run: npm ci
      - run: npm run ios:synchroniser
      - name: Choisir un simulateur iPhone iOS 26.2
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads((Path(os.environ['RUNNER_TEMP']) / 'simulators.json').read_text())['devices']
          # Même version que le SDK sélectionné ; ne pas prendre le premier ancien runtime.
          # iOS 18.5 présente notamment le bug WebKit https://bugs.webkit.org/show_bug.cgi?id=293831
          runtime = 'com.apple.CoreSimulator.SimRuntime.iOS-26-2'
          iphones = [d for d in devices.get(runtime, [])
                     if d['name'].startswith('iPhone') and d['isAvailable']]
          if not iphones:
              raise SystemExit('Aucun simulateur iPhone iOS 26.2 disponible')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('IOS_SIMULATOR_ID=' + iphones[0]['udid'] + '\n')
          print(iphones[0]['name'], iphones[0]['udid'])
          PY
      - name: Compiler et tester le démarrage réel dans le simulateur
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID"
          -derivedDataPath "$RUNNER_TEMP/placelibre-build"
          -resultBundlePath "$RUNNER_TEMP/placelibre-startup.xcresult"
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Resultats-demarrage-iPhone
          path: ${{ runner.temp }}/placelibre-startup.xcresult
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: PlaceLibre-simulateur
          path: ${{ runner.temp }}/placelibre-build/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 7
